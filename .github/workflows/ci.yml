name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          GO_API_URL: http://localhost:8080
          GEMINI_API_URL: http://localhost:8001
          GO_API_KEY: local-dev-api-key

  go-services:
    name: Go services build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [services/db-api, services/llm-api]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - run: go mod download
      - run: go test ./...
